[project]
name = "paythonproject-8"
version = "0.1.0"
description = "Практика по logging (Skypro)"
authors = [
    {name = "Viktor Getjmanov", email = "palada1973@gmail.com"}
]
requires-python = "^3.13"
dependencies = [
    "python-dotenv (>=1.0.1,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.0.0,<8.0.0)",
    "mypy (>=1.8.0,<2.0.0)",
    "black (>=24.0.0,<25.0.0)",
    "isort (>=5.13.0,<6.0.0)"
]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=5.0.0,<6.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv|.venv'

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
)
'''

[tool.isort]
line_length = 119

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[tool.poetry]
package-mode = false
name = "paythonproject-8"